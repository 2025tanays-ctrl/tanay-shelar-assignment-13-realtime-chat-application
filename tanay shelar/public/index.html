<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Chat App </h1>

    <h2>Live Users:- <span id="users-count">0</span></h2>

    <div id="login-box">
        Enter Username:-<input id="username">
        <button onclick="joinChat()">Join Chat</button>
    </div>

    <div id="chat-box" >
        Enter Your Message:-<input type="text" id="message">
        <button onclick="sendMessage()">Send message</button>
    </div>

    <div>
        <div id="message-box"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket=io();

        socket.on('users-count', (count) => {
            document.getElementById('users-count').innerHTML = count;

        });

        function joinChat(){
        let username=document.getElementById('username').value;
        socket.emit('new-user-joined',username);
        document.getElementById('login-box').style.display='none';
        document.getElementById('chat-box').style.display='block';
        }

        function sendMessage(){
            let message=document.getElementById('message').value;
            socket.emit('send-message',message);
            document.getElementById('message').value='';
        }
        socket.on('recieve-message',(data)=>{
            let p=document.createElement('p');
            p.innerText=`${data.username}--->${data.message}`;
            document.getElementById('message-box').appendChild(p);


        });
    </script>
</body>
</html>
